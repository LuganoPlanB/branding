name: Validate slide template
on:
  push:
    branches: [main]
    paths: ['slides/**', '.github/workflows/slides.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate editable Office packages
        run: python slides/check_template.py
      - name: Install renderer and fonts
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils
          mkdir -p "$HOME/.local/share/fonts/planb"
          cp slides/fonts/Inter-Regular.ttf slides/fonts/Inter-Bold.ttf "$HOME/.local/share/fonts/planb/"
          fc-cache -f
      - name: Render starter and template
        shell: bash
        run: |
          set -Eeuo pipefail
          for mode in light dark; do
            mkdir -p "rendered/$mode/template"
            libreoffice -env:UserInstallation=file:///tmp/planb-office --headless --convert-to pdf --outdir "rendered/$mode" "slides/planb-starter-$mode.pptx"
            libreoffice -env:UserInstallation=file:///tmp/planb-office --headless --convert-to pdf --outdir "rendered/$mode/template" "slides/planb-template-$mode.potx"
            test -s "rendered/$mode/planb-starter-$mode.pdf"
            test -s "rendered/$mode/template/planb-template-$mode.pdf"
            pdfinfo "rendered/$mode/planb-starter-$mode.pdf"
            pdftoppm -scale-to 1280 -png "rendered/$mode/planb-starter-$mode.pdf" "rendered/$mode/slide"
            pdftoppm -scale-to 1280 -png "rendered/$mode/template/planb-template-$mode.pdf" "rendered/$mode/template/slide"
            pdftotext -layout "rendered/$mode/planb-starter-$mode.pdf" "rendered/$mode/text.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: planb-slides-preview
          path: rendered/
